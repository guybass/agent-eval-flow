<rect x="1412" y="447" width="224" height="53" rx="0" fill="#FFF0EE" stroke="#D7E0E8" stroke-width="1.3"/>
<text x="1424" y="475.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#172C42">No</text>
<rect x="44" y="500" width="444" height="53" rx="0" fill="#FFFFFF" stroke="#D7E0E8" stroke-width="1.3"/>
