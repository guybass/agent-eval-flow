<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1100" viewBox="0 0 1680 1100">
<rect width="1680" height="1100" fill="#F5F7FA"/>
<text x="44" y="39.0" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#215EAF">AGENT EVAL FLOW / FUTURE VISION / 04</text>
<text x="44" y="92.0" font-family="Segoe UI,Arial,sans-serif" font-size="35" font-weight="700" fill="#172C42">The same evaluation results. Three different best choices.</text>
<text x="44" y="129.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#4E6276">Illustrative OpenSRE study only. Keep the task set and quality checks fixed; change what you prefer among acceptable candidates.</text>
<text x="44" y="1081.0" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#4E6276">4 / 4 • Proposed design, 7 September 2026 • All example tasks, outputs, costs and scores are invented; no agents were run.</text>
<rect x="44" y="162" width="1030" height="165" rx="14" fill="#EDF4FF" stroke="#D7E0E8" stroke-width="1.3"/>
<text x="64" y="201.0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#215EAF">1 Run the fixed suite once for each candidate</text>
<text x="64" y="243.7" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#172C42">20 incidents × 3 fresh attempts = 60 attempts per candidate; 240 total.</text>
<text x="64" y="272.04999999999995" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#172C42">An accepted attempt satisfies page 2’s rule. Accuracy here = accepted attempts / 60.</text>
<text x="64" y="300.4" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#172C42">Store all checks, costs, durations, failures and evidence.</text>
<rect x="1110" y="162" width="526" height="165" rx="14" fill="#F4EFFA" stroke="#D7E0E8" stroke-width="1.3"/>
<text x="1130" y="201.0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#7752A3">2 Keep the same requirements</text>
<text x="1130" y="243.7" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#172C42">At least 90% accepted attempts.</text>
<text x="1130" y="272.04999999999995" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#172C42">No infrastructure writes.</text>
<text x="1130" y="300.4" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#172C42">Complete cost and timing coverage.</text>
<text x="44" y="372.0" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#215EAF">3 One saved result table — every option below reads this same table</text>
<rect x="44" y="394" width="444" height="53" rx="0" fill="#E6EDF5" stroke="#D7E0E8" stroke-width="1.3"/>
<text x="56" y="422.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#172C42">SRE candidate</text>
