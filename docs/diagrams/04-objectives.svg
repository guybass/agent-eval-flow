<rect x="1412" y="394" width="224" height="53" rx="0" fill="#E6EDF5" stroke="#D7E0E8" stroke-width="1.3"/>
<text x="1424" y="422.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#172C42">Meets minimum?</text>
<rect x="44" y="447" width="444" height="53" rx="0" fill="#FFF0EE" stroke="#D7E0E8" stroke-width="1.3"/>
