<rect x="1412" y="553" width="224" height="53" rx="0" fill="#FFFFFF" stroke="#D7E0E8" stroke-width="1.3"/>
<text x="1424" y="581.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#172C42">Yes</text>
<rect x="44" y="606" width="444" height="53" rx="0" fill="#FFFFFF" stroke="#D7E0E8" stroke-width="1.3"/>
<text x="56" y="634.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#172C42">D B + parallel evidence flow</text>
<rect x="488" y="606" width="240" height="53" rx="0" fill="#FFFFFF" stroke="#D7E0E8" stroke-width="1.3"/>
<text x="500" y="634.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#172C42">57/60 = 95%</text>
<rect x="728" y="606" width="232" height="53" rx="0" fill="#FFFFFF" stroke="#D7E0E8" stroke-width="1.3"/>
<text x="740" y="634.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#172C42">$0.90</text>
<rect x="960" y="606" width="232" height="53" rx="0" fill="#FFFFFF" stroke="#D7E0E8" stroke-width="1.3"/>
<text x="972" y="634.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#172C42">65 s</text>
<rect x="1192" y="606" width="220" height="53" rx="0" fill="#FFFFFF" stroke="#D7E0E8" stroke-width="1.3"/>
<text x="1204" y="634.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#172C42">0</text>
<rect x="1412" y="606" width="224" height="53" rx="0" fill="#FFFFFF" stroke="#D7E0E8" stroke-width="1.3"/>
<text x="1424" y="634.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#172C42">Yes</text>
<text x="44" y="689.0" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#4E6276">Cost = total declared run spend / all 60 attempts, including retries and failures. Duration = end-to-end wall time; p95 uses all attempts.</text>
<text x="44" y="753.0" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#215EAF">4 Change only the selection objective</text>
<rect x="44" y="777" width="508" height="166" rx="14" fill="#EAF7F5" stroke="#D7E0E8" stroke-width="1.3"/>
<text x="64" y="816.0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#087D83">Spend less → choose B</text>
<text x="64" y="858.7" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#172C42">Lowest mean cost that meets requirements.</text>
<text x="64" y="887.0500000000001" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#172C42">$0.24 per attempt; 90% accepted.</text>
<text x="64" y="915.4000000000001" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#172C42">A is cheaper but fails the quality floor.</text>
<rect x="586" y="777" width="508" height="166" rx="14" fill="#EDF4FF" stroke="#D7E0E8" stroke-width="1.3"/>
<text x="606" y="816.0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#215EAF">Respond faster → choose D</text>
<text x="606" y="858.7" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#172C42">Lowest p95 duration that meets requirements.</text>
<text x="606" y="887.0500000000001" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#172C42">65 s; 95% accepted.</text>
<text x="606" y="915.4000000000001" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#172C42">More parallel work costs $0.90 per attempt.</text>
<rect x="1128" y="777" width="508" height="166" rx="14" fill="#F4EFFA" stroke="#D7E0E8" stroke-width="1.3"/>
<text x="1148" y="816.0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#7752A3">Maximize accuracy → choose C</text>
<text x="1148" y="858.7" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#172C42">Highest acceptance rate.</text>
<text x="1148" y="887.0500000000001" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#172C42">59/60 = 98.3%; $0.65 per attempt.</text>
<text x="1148" y="915.4000000000001" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#172C42">Allow p95 duration up to 120 s.</text>
<text x="44" y="997.0" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#172C42">No rerun is needed to change this preference. To improve the agent itself, create candidate E and run the fixed suite again.</text>
<text x="44" y="1036.0" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#4E6276">These are sample choices, not proven population winners. Use per-incident uncertainty and held-out confirmation; three repeats are not three new incidents.</text>
</svg>