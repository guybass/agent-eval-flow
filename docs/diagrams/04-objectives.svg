<rect x="1192" y="500" width="220" height="53" rx="0" fill="#FFFFFF" stroke="#D7E0E8" stroke-width="1.3"/>
<text x="1204" y="528.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#172C42">0</text>
<rect x="1412" y="500" width="224" height="53" rx="0" fill="#FFFFFF" stroke="#D7E0E8" stroke-width="1.3"/>
<text x="1424" y="528.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#172C42">Yes</text>
<rect x="44" y="553" width="444" height="53" rx="0" fill="#FFFFFF" stroke="#D7E0E8" stroke-width="1.3"/>
<text x="56" y="581.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#172C42">C B + different model</text>
<rect x="488" y="553" width="240" height="53" rx="0" fill="#FFFFFF" stroke="#D7E0E8" stroke-width="1.3"/>
<text x="500" y="581.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#172C42">59/60 = 98.3%</text>
<rect x="728" y="553" width="232" height="53" rx="0" fill="#FFFFFF" stroke="#D7E0E8" stroke-width="1.3"/>
<text x="740" y="581.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#172C42">$0.65</text>
<rect x="960" y="553" width="232" height="53" rx="0" fill="#FFFFFF" stroke="#D7E0E8" stroke-width="1.3"/>
