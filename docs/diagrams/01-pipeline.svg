<rect x="44" y="905" width="920" height="142" rx="14" fill="#F4EFFA" stroke="#D7E0E8" stroke-width="1.3"/>
<text x="64" y="944.0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#7752A3">One record format for both adapters</text>
<text x="64" y="984.7" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#172C42">task_id + candidate version + attempt_id + artifacts + status/error + elapsed time + tokens + cost +</text>
<text x="64" y="1010.35" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#172C42">human effort. Missing evidence stays “unknown”.</text>
<rect x="1000" y="905" width="636" height="142" rx="14" fill="#EDF4FF" stroke="#D7E0E8" stroke-width="1.3"/>
<text x="1020" y="944.0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#215EAF">7 Goal → next experiment</text>
<text x="1020" y="984.7" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#172C42">Keep the same checks. Prefer quality, lower cost or lower latency.</text>
<text x="1020" y="1010.35" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#172C42">Change one component, then repeat within that project.</text>
<text x="44" y="886.0" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#4E6276">* OpenKritt step data needs a separate collection seam; the findings ZIP alone is insufficient. Adapters and the shared engine are proposed.</text>
