<text x="624" y="476.65" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#172C42">Tool calls + status/error</text>
<rect x="940" y="320" width="320" height="240" rx="14" fill="#FFFFFF" stroke="#D7E0E8" stroke-width="1.3"/>
