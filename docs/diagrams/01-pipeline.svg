<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1100" viewBox="0 0 1680 1100">
<rect width="1680" height="1100" fill="#F5F7FA"/>
<text x="44" y="39.0" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#215EAF">AGENT EVAL FLOW / FUTURE VISION / 01</text>
<text x="44" y="92.0" font-family="Segoe UI,Arial,sans-serif" font-size="35" font-weight="700" fill="#172C42">One evaluation home. Separate agent studies.</text>
<text x="44" y="129.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#4E6276">Follow either row from left to right. Each project owns its tasks, checks and candidate comparisons.</text>
<text x="44" y="1081.0" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#4E6276">1 / 4 • Proposed design, 7 September 2026 • All example tasks, outputs, costs and scores are invented; no agents were run.</text>
<rect x="44" y="162" width="1592" height="106" rx="14" fill="#EDF4FF" stroke="#D7E0E8" stroke-width="1.3"/>
<text x="64" y="201.0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#215EAF">1 Declare the experiment</text>
<text x="64" y="243.7" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#172C42">Choose a skill, flow, model or harness change. Freeze the task set, hidden answers, checks and allowed budget before running candidates.</text>
<text x="44" y="298.0" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#215EAF">OPENSRE STUDY</text>
<rect x="44" y="320" width="244" height="240" rx="14" fill="#FFFFFF" stroke="#D7E0E8" stroke-width="1.3"/>
<text x="64" y="359.0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#215EAF">2 Task pack</text>
<text x="64" y="399.7" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#172C42">Incident ID + alert</text>
<text x="64" y="425.34999999999997" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#172C42">Frozen telemetry</text>
<text x="64" y="451.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#172C42">Read-only tool replies</text>
<text x="64" y="476.65" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#172C42">Agent sees inputs only</text>
<rect x="324" y="320" width="244" height="240" rx="14" fill="#EDF4FF" stroke="#D7E0E8" stroke-width="1.3"/>
<text x="344" y="359.0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#215EAF">3 Agent backend</text>
<text x="344" y="399.7" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#172C42">A: baseline</text>
<text x="344" y="425.34999999999997" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#172C42">B: + runbook guidance</text>
<text x="344" y="451.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#172C42">Same model and tools</text>
<text x="344" y="476.65" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#172C42">Fresh session per run</text>
<rect x="604" y="320" width="300" height="240" rx="14" fill="#FFFFFF" stroke="#D7E0E8" stroke-width="1.3"/>
