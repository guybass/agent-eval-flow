<text x="960" y="399.7" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#172C42">Load private answers here</text>
<text x="960" y="425.34999999999997" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#172C42">Check cause + metric facts</text>
<text x="960" y="451.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#172C42">Check proposed remedy</text>
<text x="960" y="476.65" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#172C42">Record points + evidence</text>
