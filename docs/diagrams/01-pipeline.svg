<text x="624" y="399.7" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#172C42">Diagnosis + report</text>
<text x="624" y="425.34999999999997" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#172C42">Causal claims + citations</text>
