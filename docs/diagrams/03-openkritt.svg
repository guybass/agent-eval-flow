<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1100" viewBox="0 0 1680 1100">
<rect width="1680" height="1100" fill="#F5F7FA"/>
<text x="44" y="39.0" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#215EAF">AGENT EVAL FLOW / FUTURE VISION / 03</text>
<text x="44" y="92.0" font-family="Segoe UI,Arial,sans-serif" font-size="35" font-weight="700" fill="#172C42">OpenKritt: did a review skill find more real bugs?</text>
<text x="44" y="129.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#4E6276">An independent security study. Its scores are meaningful within this study; they do not rank OpenKritt against OpenSRE.</text>
<text x="44" y="1081.0" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#4E6276">3 / 4 • Proposed design, 7 September 2026 • All example tasks, outputs, costs and scores are invented; no agents were run.</text>
<rect x="44" y="162" width="344" height="284" rx="14" fill="#EAF7F5" stroke="#D7E0E8" stroke-width="1.3"/>
<text x="64" y="201.0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#087D83">1 A tiny repository task</text>
<text x="64" y="242.7" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#172C42">Task K-001 has two snapshots:</text>
<text x="64" y="269.7" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#172C42">V: missing ownership check (B1);</text>
<text x="64" y="296.7" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#172C42">unsafe path handling (B2).</text>
<text x="64" y="323.7" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#172C42">P: both bugs fixed.</text>
<text x="64" y="350.7" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#172C42">Fresh scans; agent sees code.</text>
<text x="64" y="377.7" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#172C42">Bug IDs and tests stay private.</text>
<rect x="430" y="162" width="344" height="284" rx="14" fill="#EAF7F5" stroke="#D7E0E8" stroke-width="1.3"/>
<text x="450" y="201.0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#087D83">2 OpenKritt backend</text>
<text x="450" y="242.7" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#172C42">A: baseline workflow W1.</text>
<text x="450" y="269.7" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#172C42">B: W1 + review skill for ownership</text>
<text x="450" y="296.7" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#172C42">and path handling.</text>
<text x="450" y="323.7" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#172C42">Same model, flow and budgets.</text>
<text x="450" y="350.7" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#172C42">Search → findings → native</text>
<text x="450" y="377.7" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#172C42">validation / dedup / ranking.</text>
<rect x="816" y="162" width="394" height="284" rx="14" fill="#FFFFFF" stroke="#D7E0E8" stroke-width="1.3"/>
<text x="836" y="201.0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#087D83">3 Native outputs</text>
<text x="836" y="242.7" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#172C42">Finding text + file_path + line</text>
<text x="836" y="269.7" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#172C42">Summary + trigger_flow</text>
<text x="836" y="296.7" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#172C42">Reproduction claim</text>
<text x="836" y="323.7" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#172C42">Findings ZIP + scan status</text>
<text x="836" y="350.7" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#172C42">Separate step records: raw output,</text>
<text x="836" y="377.7" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#172C42">lineage, timings and usage*</text>
<rect x="1252" y="162" width="384" height="284" rx="14" fill="#FFFFFF" stroke="#D7E0E8" stroke-width="1.3"/>
<text x="1272" y="201.0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#087D83">4 Invented final findings</text>
<text x="1272" y="242.7" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#172C42">A on V: reports B1; misses B2.</text>
<text x="1272" y="269.7" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#172C42">A on P: falsely reports B1.</text>
<text x="1272" y="296.7" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#172C42">B on V: reports B1 and B2.</text>
<text x="1272" y="323.7" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#172C42">B on P: reports neither.</text>
<text x="1272" y="350.7" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#172C42">Adapter attaches finding IDs and</text>
<text x="1272" y="377.7" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#172C42">snapshot / candidate versions.</text>
