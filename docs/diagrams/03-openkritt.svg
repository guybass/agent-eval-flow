<text x="1148" y="704.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#172C42">20</text>
<rect x="1256" y="676" width="380" height="48" rx="0" fill="#FFFFFF" stroke="#D7E0E8" stroke-width="1.3"/>
<text x="1268" y="704.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#172C42">B1 is fixed on P</text>
<rect x="504" y="724" width="512" height="48" rx="0" fill="#EAF7F5" stroke="#D7E0E8" stroke-width="1.3"/>
<text x="516" y="752.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#172C42">Fixture score / 100</text>
