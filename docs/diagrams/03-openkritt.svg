<polygon points="430,304.0 420.0477317045804,308.685334115726 420.0477317045804,299.314665884274" fill="#087D83"/>
<polyline points="774,304.0 816,304.0" fill="none" stroke="#087D83" stroke-width="2"/>
<polygon points="816,304.0 806.0477317045804,308.685334115726 806.0477317045804,299.314665884274" fill="#087D83"/>
<polyline points="1210,304.0 1252,304.0" fill="none" stroke="#087D83" stroke-width="2"/>
<polygon points="1252,304.0 1242.0477317045804,308.685334115726 1242.0477317045804,299.314665884274" fill="#087D83"/>
<rect x="44" y="494" width="416" height="288" rx="14" fill="#F4EFFA" stroke="#D7E0E8" stroke-width="1.3"/>
<text x="64" y="533.0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#7752A3">5 Independent checks</text>
<text x="64" y="574.7" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#172C42">B1: read another user’s order.</text>
<text x="64" y="601.7" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#172C42">V returns 200; P rejects with 403.</text>
<text x="64" y="628.7" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#172C42">B2: read outside the allowed folder.</text>
<text x="64" y="655.7" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#172C42">V reads it; P rejects the request.</text>
<text x="64" y="682.7" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#172C42">Private tests verify these facts.</text>
<text x="64" y="709.7" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#172C42">Native verdicts are claims to check.</text>
<text x="504" y="508.0" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#087D83">6 Apply this fixture’s rubric (v1)</text>
<rect x="504" y="532" width="512" height="48" rx="0" fill="#E6EDF5" stroke="#D7E0E8" stroke-width="1.3"/>
<text x="516" y="560.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#172C42">Check</text>
<rect x="1016" y="532" width="120" height="48" rx="0" fill="#E6EDF5" stroke="#D7E0E8" stroke-width="1.3"/>
<text x="1028" y="560.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#172C42">A</text>
<rect x="1136" y="532" width="120" height="48" rx="0" fill="#E6EDF5" stroke="#D7E0E8" stroke-width="1.3"/>
<text x="1148" y="560.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#172C42">B</text>
<rect x="1256" y="532" width="380" height="48" rx="0" fill="#E6EDF5" stroke="#D7E0E8" stroke-width="1.3"/>
<text x="1268" y="560.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#172C42">Why A lost points</text>
<rect x="504" y="580" width="512" height="48" rx="0" fill="#FFFFFF" stroke="#D7E0E8" stroke-width="1.3"/>
<text x="516" y="608.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#172C42">Verified B1 on V / 40</text>
<rect x="1016" y="580" width="120" height="48" rx="0" fill="#FFFFFF" stroke="#D7E0E8" stroke-width="1.3"/>
<text x="1028" y="608.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#172C42">40</text>
<rect x="1136" y="580" width="120" height="48" rx="0" fill="#FFFFFF" stroke="#D7E0E8" stroke-width="1.3"/>
<text x="1148" y="608.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#172C42">40</text>
<rect x="1256" y="580" width="380" height="48" rx="0" fill="#FFFFFF" stroke="#D7E0E8" stroke-width="1.3"/>
<text x="1268" y="608.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#172C42">B1 independently confirms</text>
<rect x="504" y="628" width="512" height="48" rx="0" fill="#FFFFFF" stroke="#D7E0E8" stroke-width="1.3"/>
<text x="516" y="656.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#172C42">Verified B2 on V / 40</text>
<rect x="1016" y="628" width="120" height="48" rx="0" fill="#FFFFFF" stroke="#D7E0E8" stroke-width="1.3"/>
<text x="1028" y="656.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#172C42">0</text>
