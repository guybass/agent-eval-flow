<text x="1148" y="656.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#172C42">40</text>
<rect x="1256" y="628" width="380" height="48" rx="0" fill="#FFFFFF" stroke="#D7E0E8" stroke-width="1.3"/>
<text x="1268" y="656.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#172C42">No B2 finding to verify</text>
<rect x="504" y="676" width="512" height="48" rx="0" fill="#FFFFFF" stroke="#D7E0E8" stroke-width="1.3"/>
<text x="516" y="704.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#172C42">No false B1/B2 claims / 20</text>
