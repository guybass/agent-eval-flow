<text x="504" y="807.0" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#4E6276">Count each known bug once. Duplicate reports earn no extra points. Other bug claims require separate adjudication.</text>
<rect x="44" y="837" width="496" height="187" rx="14" fill="#EAF7F5" stroke="#D7E0E8" stroke-width="1.3"/>
<text x="64" y="876.0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#087D83">7 Read the actual outcome</text>
<text x="64" y="917.7" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#172C42">A: 1 true finding, 1 miss, 1 false alarm.</text>
<text x="64" y="944.7" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#172C42">B: 2 true findings, 0 misses, 0 false alarms.</text>
<text x="64" y="971.7" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#172C42">Task accepted only if both bugs are verified and the</text>
<text x="64" y="998.7" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#172C42">controls pass.</text>
<rect x="572" y="837" width="508" height="187" rx="14" fill="#FFFFFF" stroke="#D7E0E8" stroke-width="1.3"/>
<text x="592" y="876.0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#087D83">Inspect → form a hypothesis</text>
<text x="592" y="917.7" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#172C42">No B2 finding → inspect search steps: was that path</text>
<text x="592" y="944.7" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#172C42">skipped or checked badly?</text>
<text x="592" y="971.7" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#172C42">The trace suggests a cause. Fresh A/B comparisons</text>
<text x="592" y="998.7" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#172C42">test the skill’s effect.</text>
<rect x="1112" y="837" width="524" height="187" rx="14" fill="#FFFFFF" stroke="#D7E0E8" stroke-width="1.3"/>
<text x="1132" y="876.0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#087D83">Keep resource and review costs</text>
<text x="1132" y="917.7" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#172C42">Sum V + P scan costs, including failures and retries.</text>
<text x="1132" y="944.7" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#172C42">Record wall time and reviewer minutes.</text>
<text x="1132" y="971.7" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#172C42">Confirm improvements on new repository families.</text>
<text x="44" y="1051.0" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#4E6276">* Findings ZIP is not a full trace export. Fresh scans provide independent attempts; OpenKritt repeat_runs expands a search using earlier outputs.</text>
</svg>