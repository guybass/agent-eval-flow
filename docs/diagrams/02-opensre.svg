<text x="64" y="272.04999999999995" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#172C42">Resource: db-replica-1.</text>
<text x="64" y="300.4" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#172C42">Lag = 120 s; CPU = 92%.</text>
<text x="64" y="328.75" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#172C42">Tool: apply_worker = blocked.</text>
