<text x="44" y="39.0" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#215EAF">AGENT EVAL FLOW / FUTURE VISION / 02</text>
<text x="44" y="92.0" font-family="Segoe UI,Arial,sans-serif" font-size="35" font-weight="700" fill="#172C42">OpenSRE: did diagnostic guidance improve the answer?</text>
<text x="44" y="129.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#4E6276">One invented incident, two complete agent configurations. Latency and cost remain separate from diagnosis quality.</text>
<text x="44" y="1081.0" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#4E6276">2 / 4 • Proposed design, 7 September 2026 • All example tasks, outputs, costs and scores are invented; no agents were run.</text>
