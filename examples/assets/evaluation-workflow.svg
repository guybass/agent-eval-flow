<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="260" viewBox="0 0 1120 260" role="img" aria-labelledby="title description">
  <title id="title">From agent evidence to a reviewable result</title>
  <desc id="description">Define a study, capture native runs or import retained evidence, evaluate explicit checks, then inspect or compare saved results. Retained evidence can be regraded without another agent run.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1L6 4L1 7" fill="none" stroke="#788b82" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="1120" height="260" rx="20" fill="#f6f7f2"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <g fill="#fffefa" stroke="#d6dfd4">
      <rect x="24" y="28" width="244" height="148" rx="14"/>
      <rect x="300" y="28" width="244" height="148" rx="14"/>
      <rect x="852" y="28" width="244" height="148" rx="14"/>
    </g>
    <rect x="576" y="28" width="244" height="148" rx="14" fill="#24584c"/>
    <g fill="#58705e" font-size="12" font-weight="600" letter-spacing="1.3">
      <text x="44" y="55">01 / STUDY</text>
      <text x="320" y="55">02 / RUN SET</text>
      <text x="872" y="55">04 / REVIEW</text>
    </g>
    <text x="596" y="55" fill="#c3d9cc" font-size="12" font-weight="600" letter-spacing="1.3">03 / RESULT</text>
    <g fill="#193d35" font-size="23" font-weight="600">
      <text x="44" y="92">Define the question</text>
      <text x="320" y="92">Keep the evidence</text>
      <text x="872" y="92">Inspect &amp; compare</text>
    </g>
    <text x="596" y="92" fill="#fffefa" font-size="23" font-weight="600">Apply your checks</text>
    <g fill="#53665b" font-size="16">
      <text x="44" y="125">Tasks, candidates, checks,</text>
      <text x="44" y="148">and execution policy</text>
      <text x="320" y="125">Capture native runs</text>
      <text x="320" y="148">or import retained runs</text>
      <text x="872" y="125">HTML reports, outcomes,</text>
      <text x="872" y="148">and candidate comparisons</text>
    </g>
    <g fill="#dce9de" font-size="16">
      <text x="596" y="125">Evaluate outcomes</text>
      <text x="596" y="148">and separate diagnostics</text>
    </g>
    <g fill="none" stroke="#788b82" stroke-width="1.6" marker-end="url(#arrow)">
      <path d="M274 102H292"/>
      <path d="M550 102H568"/>
      <path d="M826 102H844"/>
      <path d="M422 182V204H698V183"/>
    </g>
    <text x="560" y="236" text-anchor="middle" font-size="16" fill="#53665b">Regrade retained evidence without another agent run</text>
  </g>
</svg>
