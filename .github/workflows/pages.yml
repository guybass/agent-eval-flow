name: Publish report gallery

on:
  push:
    branches: [main]
    paths:
      - examples/index.html
      - examples/assets/agent-eval-flow-banner.svg
      - examples/assets/agent-eval-flow-banner.png
      - examples/reports/**
      - scripts/build_report_site.py
      - tests/unit/test_report_site.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: report-gallery-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'guybass/agent-eval-flow' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Build only approved public reports and images
        run: python scripts/build_report_site.py
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .report-site/
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the approved gallery artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
