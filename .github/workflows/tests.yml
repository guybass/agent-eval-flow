name: Tests and package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[test,cli]" build
      - run: python scripts/verify_acceptance_checkpoint.py
      - run: python -m pytest --junitxml=test-artifacts/pytest.xml
      - run: python examples/archive_review.py --output demo-output
      - run: python examples/gpt_researcher_review.py --output demo-output/gpt-researcher
      - run: python -m build
      - run: python scripts/verify_distribution.py

  toolscore:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[test,cli,toolscore]"
      - run: python -m pytest tests/unit/test_toolscore_integration.py tests/unit/test_claude_stream_records.py tests/unit/test_grading_clock_step.py tests/unit/test_deerflow_study.py tests/unit/test_mcp_memory_example.py
      - run: python examples/toolscore_review.py --output demo-output/toolscore
      - run: python examples/deerflow_review.py --output demo-output/deerflow
      - run: python examples/mcp_memory_review.py --output demo-output/mcp-memory
      - run: python examples/mcp_memory_agent_review.py --model gpt-5.6-luna --output demo-output/mcp-memory-agent
